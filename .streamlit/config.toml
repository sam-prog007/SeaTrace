# Prototype LOCAL : ne pas exposer sur un réseau (pas d'authentification).
[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 5
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1f6fb2"
